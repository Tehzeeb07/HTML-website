    <h1 align='center'>Media</h1>


    <h1> HTML Multimedia - Audio & Video</h1>
    <h2>1. Simple audio</h2>
    <audio src="../audio.mp3" Controls></audio>
    <br><br>

    <h2>2. Autoplay audio</h2>
    <audio src="../audio.mp3" autoplay muted Controls></audio>
    <br><br>

    <h2>3. Loop audio</h2>
    <audio src="../audio.mp3" loop Controls></audio>


    <h2>4. Simple video </h2>
    <video src="../bird.mp4" width=200 height=200 Controls></video>
    <br><br>

    <h2>5. autoplay video </h2>
    <video src="../bird.mp4" width=200 height=200 autoplay muted Controls></video>
    <br><br>

    <h2>6. loop video </h2>
    <video src="../bird.mp4" width=200 height=200 loop Controls></video>
    <br><br>

    <h2>7. video with poster </h2>
    <video src="../bird.mp4" poster="img1.jpg" width=200 height=200 Controls></video>
    <br><br>

    <h2>8. Embed video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/PCicKydX5GE?si=cjC2yZKTGLGG1LxH"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>
